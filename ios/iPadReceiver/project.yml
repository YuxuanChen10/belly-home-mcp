name: iPadReceiver
options:
  bundleIdPrefix: com.cc.bellyhome
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3PDA3SWWKY
targets:
  iPadReceiver:
    type: application
    platform: iOS
    sources:
      - path: Receiver
        excludes:
          - Resources
      - path: Receiver/Resources
        type: folder
    info:
      path: Receiver/Info.plist
      properties:
        CFBundleDisplayName: Belly Receiver
        NSPhotoLibraryAddUsageDescription: Belly Receiver saves a test PNG to Photos so you can verify Screenshot Sync on this iPad.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cc.bellyhome.ipadreceiver
        PRODUCT_NAME: iPadReceiver
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        COMPRESS_PNG_FILES: NO
